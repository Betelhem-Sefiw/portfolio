<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You | Betelhem Sefiw</title>
</head>
<body>

    <header>
        <nav>
            <p><a href="index.html"> &larr;back to home</a></p>
        </nav>
    </header>
    <hr>
    <main>
    <h1>Thank You | Betelhem Sefiw</h1>
    
    <p>Your message has been sent. I will reply within two days.</p>
    <aside>
   
    <p>Look at the address bar: the data you typed is in the URL.</p>
     </aside>


    <h3>Send me message</h3>
    
    <form action="thank-you.html" method="get">
        <fieldset>
            <legend>Your Details</legend>
            <label for="fullname"> Full name: </label>
            <input type="text" id="fullname" name="fullname">
            <br><br>
            <label for="email"> Email: </label>
            <input type="email" id="email" name="email">

        </fieldset>
        <fieldset>
            <legend>Your message</legend>
            <label for="reason"> Reason for contacting me: </label>
            <select name="reason" id="reason">
                <optgroup label="work">
                    <option value="internship">Internship offer</option>
                    <option value="freelance">Freelance project</option>
                    <option value="job">Full-time job</option>
                </optgroup>
                <optgroup label="study">
                    <option value="group-project">Group Project</option>
                    <option value="tutoring">Tutoring</option>
                </optgroup>
                <option value="other">Other</option>

            </select>
            <br><br>
            <label for="message">message:</label>
            <textarea name="message" id="message" rows="6" cols="40"></textarea>
        </fieldset>
        <button type="submit">send message</button>
        <button type="reset">clear</button>
        

    </form>
    </main>
    <hr>
    <footer>
        <p>Copyright &copy; 2026 Betelhem Sefiw. All rights reserved</p>
    </footer>
</body>
</html>
